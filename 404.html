<!DOCTYPE html>

<head>

<style>
:root{
  --bg:#F5F1E8; --fg:#142B3B; --muted:#5E6A72; --rule:#DBD4C6; --accent:#142B3B; --accent2:#D8573B; --tint:#EDE8DC;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
/* Light only, on purpose. */
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.0625rem;line-height:1.6}
.wrap{max-width:68rem;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));width:100%}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1{font-family:var(--display);font-stretch:78%;line-height:1.05;text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{border-bottom:1px solid var(--rule)}
.top .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.25rem;padding-block:1rem}
.mark{display:flex;align-items:center;gap:.8rem;text-decoration:none;color:var(--accent)}
.mark img{height:1.55rem;width:auto;display:block}
.mark .name{display:grid;line-height:1;font-family:var(--display);font-stretch:90%;text-transform:uppercase}
.mark .name b{font-weight:800;font-size:1.12rem;letter-spacing:-.005em}
.mark .name small{font-weight:600;font-size:.56rem;letter-spacing:.34em;color:var(--fg);margin-top:.12rem}
.tag{font-family:var(--display);font-stretch:85%;font-weight:600;font-size:.95rem;color:var(--muted)}
.legal{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.top .wrap{grid-template-columns:1fr;row-gap:.35rem}.top .legal{display:none}}
.page{background:var(--tint);border-bottom:1px solid var(--rule);display:grid;align-items:center}
.page .wrap{padding-block:5rem 4rem;display:grid;gap:1.25rem}
.page h1{font-size:clamp(3rem,9vw,6.5rem);font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:.95}
.page .statement{font-size:clamp(1.15rem,2.2vw,1.5rem);max-width:34rem;text-wrap:pretty}
.page .by{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.btn{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:1rem;letter-spacing:.02em;text-decoration:none;background:var(--accent);color:var(--bg);padding:.85rem 1.4rem;display:inline-block;justify-self:start}
.btn:hover{background:var(--accent2);color:var(--bg)}
footer{border-top:1px solid var(--rule)}
footer .wrap{padding-block:1.5rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1.5rem}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--fg)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="mark" href="/" aria-label="State 17 Consulting, home"><img src="/assets/s17-mark.svg" alt="" width="160" height="69"><span class="name" aria-hidden="true"><b>State17</b><small>Consulting</small></span></a>
    <span class="tag">A boutique venture architecture firm</span>
    <span class="legal">State 17 Consulting LLC</span>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <span class="mono">404</span>
    <h1>Not here.</h1>
    <p class="statement">That page doesn't exist, or it moved. The site is one page, and everything is on it.</p>
    <a class="btn" href="/">Back to the site</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <span class="mono">State 17 Consulting LLC</span>
    <a class="mono" href="mailto:jim@state17consulting.com">jim@state17consulting.com</a>
  </div>
</footer>

</body>
</html>
